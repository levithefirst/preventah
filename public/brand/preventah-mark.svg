<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Preventah">
  <title>Preventah</title>
  <!--
    The Ahead Frame. A cream window with an ink edge, a blush plate one step
    behind it, and a mint bar for today. The same geometry as every card in
    the product, which is why the logo and the UI read as one system.

    The P is drawn as a path, not set in a typeface: an SVG used as a favicon
    or an app icon has no access to a webfont, and text would fall back to
    whatever the renderer had lying around.
  -->
  <defs>
    <clipPath id="pv-front">
      <rect x="2" y="2" width="52" height="52" rx="14" />
    </clipPath>
  </defs>

  <!-- One step behind -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#E8B4B8" />

  <!-- The sheet -->
  <rect x="2" y="2" width="52" height="52" rx="14" fill="#F6F1E8" />

  <!-- Today bar, clipped to the sheet's rounded top -->
  <g clip-path="url(#pv-front)">
    <rect x="2" y="2" width="52" height="12" fill="#B7D9C2" />
    <g stroke="#8FC4A3" stroke-width="1" opacity="0.5">
      <path d="M10.5 2v12M19 2v12M27.5 2v12M36 2v12M44.5 2v12" />
      <path d="M2 7.5h52" />
    </g>
  </g>

  <!-- Ink edge, drawn last so it sits over the bar -->
  <rect x="2" y="2" width="52" height="52" rx="14" fill="none" stroke="#141414" stroke-width="2.5" />
  <path d="M2 14h52" stroke="#141414" stroke-width="2.5" />

  <!-- P -->
  <path
    fill="#141414"
    fill-rule="evenodd"
    d="M16 21h15.5a8.5 8.5 0 0 1 0 17h-7v9H16V21Zm8.5 5h6.5a3.5 3.5 0 0 1 0 7h-6.5v-7Z"
  />
</svg>
