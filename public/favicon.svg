<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon. Two things change from the full mark, both because of 16px.

    The mint grid goes: 1px lines at that size turn the top of the mark into
    mud. And the P is drawn larger and heavier, filling the plate the header
    bar would otherwise occupy, because at 16px the letter is the only thing
    doing any recognising. The offset plate stays, since the silhouette is
    what makes this mark itself rather than a generic rounded square.
  -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#E8B4B8" />
  <rect x="2" y="2" width="52" height="52" rx="14" fill="#F6F1E8" stroke="#141414" stroke-width="2.5" />
  <path
    fill="#141414"
    fill-rule="evenodd"
    d="M12 10h20.5a11 11 0 0 1 0 22H24v14H12V10Zm12 6h8.5a5 5 0 0 1 0 10H24V16Z"
  />
</svg>
